<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an account | Student Finance</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; font-family: Arial, sans-serif; }
    main { width: min(440px, calc(100% - 32px)); padding: 30px; background: white; border: 1px solid #e0e7f0; border-radius: 12px; box-shadow: 0 8px 30px #17203312; }
    h1 { margin-top: 0; font-size: 24px; } label { display: block; margin: 16px 0 6px; font-weight: 700; }
    input { width: 100%; box-sizing: border-box; padding: 11px; border: 1px solid #ccd6e3; border-radius: 7px; }
    button { margin-top: 20px; width: 100%; padding: 12px; border: 0; border-radius: 7px; background: #1675d1; color: white; font-weight: 700; cursor: pointer; }
    .errorlist, .helptext { color: #66758b; font-size: 13px; }
  </style>
</head>
<body><main>
  <h1>Create your account</h1>
  <p>Sign up to keep your personal finance records.</p>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
      {{ field.errors }}
      {% if field.help_text %}<div class="helptext">{{ field.help_text }}</div>{% endif %}
    {% endfor %}
    <button type="submit">Create account</button>
  </form>
  <p>Already have an account? <a href="{% url 'login' %}">Log in</a></p>
</main></body>
</html>
