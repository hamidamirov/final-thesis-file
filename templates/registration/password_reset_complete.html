{% load ui %}
<!doctype html>
<html lang="{{ site_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% tr "Password updated" %} | {% tr "Student Finance" %}</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; font-family: Arial, sans-serif; color: #172b45; background: linear-gradient(135deg, #e7f3ff, #f7faff 60%, #e9f8f3); }
    main { width: min(100%, 520px); padding: 42px; border: 1px solid #dce7f4; border-radius: 18px; background: white; box-shadow: 0 18px 50px #173b6718; }
    h1 { margin: 0; color: #173b67; font-size: 30px; }
    p { color: #667b93; line-height: 1.7; }
    a { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 12px; padding: 0 18px; border-radius: 9px; color: white; background: #1675d1; font-weight: 700; text-decoration: none; }
    a:hover { background: #0f63b6; }
  </style>
</head>
<body><main><h1>{% tr "Password updated" %}</h1><p>{% tr "Your password has been changed. You can now log in with your new password." %}</p><a href="{% url 'login' %}">{% tr "Log in" %}</a></main></body>
</html>
