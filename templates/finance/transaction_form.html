{% load ui %}
<!doctype html>
<html lang="{{ site_language }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title|translate:site_language }} | {% tr "Student Finance" %}</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; font-family: Arial, sans-serif; }
    main { width: min(500px, calc(100% - 32px)); padding: 28px; background: white; border: 1px solid #e0e7f0; border-radius: 12px; }
    label { display: block; margin: 14px 0 6px; font-weight: 700; }
    input, select { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccd6e3; border-radius: 7px; }
    button { padding: 11px 16px; border: 0; border-radius: 7px; background: #1675d1; color: white; font-weight: 700; cursor: pointer; }
    .cancel { margin-left: 12px; }
    .errorlist { color: #b42318; }
    .preferences { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 20px; }
    .preferences label { flex: 1; margin: 0; font-size: 12px; }
    .preferences select { width: 100%; padding: 8px; }
    .preferences button { width: auto; margin: 0; padding: 9px 12px; }
    body[data-theme="dark"] { background: #111827; color: #e7edf5; }
    body[data-theme="dark"] main { background: #1c2736; border-color: #344357; }
    body[data-theme="dark"] input, body[data-theme="dark"] select { background: #111827; color: #e7edf5; border-color: #52647a; }
    body[data-theme="dark"] a { color: #8fc1ff; }
  </style>
</head>
<body data-theme="{{ site_theme }}"><main>
  {% include "includes/preferences.html" %}
  <h1>{{ title|translate:site_language }}</h1>
  <form method="post">{% csrf_token %}
    {{ form.non_field_errors }}
    {% for field in form %}<label for="{{ field.id_for_label }}">{{ field.label|translate:site_language }}</label>{{ field }}{{ field.errors }}{% endfor %}
    <p><button type="submit">{{ button_label|translate:site_language }}</button><a class="cancel" href="{% url 'home' %}">{% tr "Cancel" %}</a></p>
  </form>
</main></body>
</html>
