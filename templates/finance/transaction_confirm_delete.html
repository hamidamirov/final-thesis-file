<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete transaction | Student Finance</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f3f6fb; color: #172033; font-family: Arial, sans-serif; }
    main { width: min(500px, calc(100% - 32px)); padding: 28px; background: white; border: 1px solid #e0e7f0; border-radius: 12px; }
    button { padding: 11px 16px; border: 0; border-radius: 7px; background: #b42318; color: white; font-weight: 700; cursor: pointer; }
    a { margin-left: 12px; }
  </style>
</head>
<body><main>
  <h1>Delete transaction?</h1>
  <p>Are you sure you want to delete “{{ transaction.get_type_display }}: {{ transaction.category }} ({{ transaction.amount }})”?</p>
  <form method="post">{% csrf_token %}<button type="submit">Delete</button><a href="{% url 'home' %}">Cancel</a></form>
</main></body>
</html>
