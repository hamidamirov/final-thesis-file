{% load ui %}
<form class="navbar-language" method="post" action="{% url 'save_preferences' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <select name="language" aria-label="{% tr 'Language' %}" onchange="this.form.requestSubmit()">
    {% for code, label in language_options %}<option value="{{ code }}" {% if site_language == code %}selected{% endif %}>{{ code|upper }}</option>{% endfor %}
  </select>
</form>
<form class="navbar-theme" method="post" action="{% url 'save_preferences' %}">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <input type="hidden" name="language" value="{{ site_language }}">
  <button type="submit" name="theme" value="{% if site_theme == 'dark' %}light{% else %}dark{% endif %}" title="{% if site_theme == 'dark' %}{% tr 'Switch to light mode' %}{% else %}{% tr 'Switch to dark mode' %}{% endif %}" aria-label="{% if site_theme == 'dark' %}{% tr 'Switch to light mode' %}{% else %}{% tr 'Switch to dark mode' %}{% endif %}">{% if site_theme == "dark" %}☀{% else %}☾{% endif %}</button>
</form>
