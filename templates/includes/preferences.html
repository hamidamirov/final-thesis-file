{% load ui %}
<form method="post" action="{% url 'save_preferences' %}" class="preferences">
  {% csrf_token %}
  <input type="hidden" name="next" value="{{ request.get_full_path }}">
  <label>{% tr "Language" %}
    <select name="language" onchange="this.form.requestSubmit()">
      {% for code, label in language_options %}<option value="{{ code }}" {% if site_language == code %}selected{% endif %}>{{ label }}</option>{% endfor %}
    </select>
  </label>
  <label>{% tr "Theme" %}
    <select name="theme" onchange="this.form.requestSubmit()">
      {% for code, label in theme_options %}<option value="{{ code }}" {% if site_theme == code %}selected{% endif %}>{{ label|translate:site_language }}</option>{% endfor %}
    </select>
  </label>
</form>
