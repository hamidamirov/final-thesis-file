{% extends "admin/base.html" %}
{% load ui %}

{% block usertools %}
  {{ block.super }}
  <form method="post" action="{% url 'save_preferences' %}" class="admin-language-preference">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <label for="admin-language">{% tr "Language" %}</label>
    <select id="admin-language" name="language" onchange="this.form.requestSubmit()">
      {% for code, label in language_options %}
        <option value="{{ code }}" {% if site_language == code %}selected{% endif %}>{{ label }}</option>
      {% endfor %}
    </select>
  </form>
  <style>
    #user-tools { display: flex; align-items: center; justify-content: flex-end; gap: 10px; flex-wrap: wrap; }
    .admin-language-preference { display: inline-flex; align-items: center; gap: 5px; margin: 0; }
    .admin-language-preference label { color: inherit; font-size: 11px; }
    .admin-language-preference select { font-size: 11px; max-width: 135px; }
  </style>
{% endblock %}
